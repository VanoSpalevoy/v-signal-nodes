# cargo-deny configuration: `cargo deny check licenses` runs in CI.
#
# Only permissive licenses are allowed: no GPL-licensed code, and no LGPL either
# (Rust crates are linked statically). A crate offering a choice of licenses
# passes when one of them is allowed, so `self_cell` (Apache-2.0 OR GPL-2.0-only)
# and `r-efi` (MIT OR Apache-2.0 OR LGPL-2.1-or-later) are used under the
# permissive one.

[graph]
# Every platform and feature, so a dependency that only one target or feature
# pulls in is checked too.
all-features = true

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
