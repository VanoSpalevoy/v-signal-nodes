[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/runtime",
    "crates/device",
    "crates/plugin-api",
    "crates/plugin-host",
    "crates/plugin-std",
    "crates/plugin-stub-oscillograph",
    "crates/app",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99.1"
license = "BSD-3-Clause"

[workspace.dependencies]
egui = "0.37.0"
eframe = "0.37.0"
# The first device driver (`crates/device`). On Linux it links ALSA's libasound
# (LGPL-2.1) dynamically, through `alsa-sys`; no JACK (off by default).
cpal = "0.18.2"
libloading = "0.9.0"
# Lock-free queues to and from the real-time thread (`runtime::realtime`,
# `plugin-stub-oscillograph`).
rtrb = "0.4.1"
# Only the macOS menu bar uses it; the default `gtk3` feature is Linux-only.
muda = { version = "0.21.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
v-signal-nodes-core = { path = "crates/core" }
v-signal-nodes-runtime = { path = "crates/runtime" }
v-signal-nodes-device = { path = "crates/device" }
v-signal-nodes-plugin-api = { path = "crates/plugin-api" }
v-signal-nodes-plugin-host = { path = "crates/plugin-host" }
v-signal-nodes-plugin-std = { path = "crates/plugin-std" }
v-signal-nodes-plugin-stub-oscillograph = { path = "crates/plugin-stub-oscillograph" }

[workspace.lints.clippy]
# Every `unsafe` block carries a `// SAFETY:` comment; keep it that way.
undocumented_unsafe_blocks = "warn"

# `cargo run` builds the dev profile. Unoptimized, connection routing (A*) and
# egui itself run ~10x slower and the editor stutters while dragging, so dev
# builds get basic optimizations (still with debug info and debug assertions),
# and dependencies, rarely rebuilt, full ones.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# No `panic = "abort"`: plugins (cdylibs built with this profile too) rely on
# `catch_unwind` in `plugin-api`'s FFI layer to keep a panicking node from taking
# down the editor.
strip = "symbols"